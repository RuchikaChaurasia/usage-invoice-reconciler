services:
  mysql:
    image: mysql:8.4
    container_name: recon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: recon
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./sql/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
